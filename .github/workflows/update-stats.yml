name: Update live stats

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (GitHub may delay runs a bit)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  push:
    paths:
      - 'scripts/update-stats.mjs'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch LeetCode + GitHub data
        run: node scripts/update-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/stats.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stats.json
            git commit -m "chore: update live stats"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "Nothing to commit."
          fi
